<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>地點座標整理工具 v1.2</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--b:#07111f;--p:#10243a;--l:#29445e;--t:#f8fafc;--m:#a6b6c8;--o:#ff6b22}*{box-sizing:border-box}html,body{margin:0;background:var(--b);color:var(--t);font-family:"Microsoft JhengHei",sans-serif}.app{display:grid;grid-template-columns:360px minmax(0,1fr);min-height:100vh}.panel{padding:18px;border-right:1px solid var(--l);overflow:auto}.mapwrap{padding:12px}h1{font-size:21px;margin:0 0 8px}p{color:var(--m);font-size:13px;line-height:1.6}label{display:block;margin:13px 0 6px;font-weight:700;font-size:13px}select,input,button{width:100%;padding:10px;border-radius:9px;border:1px solid var(--l);background:#091827;color:#fff;font:inherit}button{cursor:pointer;font-weight:800;background:var(--o);border:0;margin-top:10px}.secondary{background:#173149;border:1px solid var(--l)}.coords{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{margin-top:12px;padding:10px;border-radius:9px;background:#13283e;color:#fcd34d;font-size:12px}.list{display:grid;gap:7px;margin-top:12px}.row{padding:9px;border:1px solid var(--l);border-radius:9px;font-size:12px}.done{border-color:#2dd4bf}.row b{display:block;margin-bottom:3px}#map{height:calc(100vh - 24px);border-radius:12px}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#10243a;color:#fff}@media(max-width:800px){.app{display:block}.panel{border-right:0;border-bottom:1px solid var(--l)}#map{height:60vh;min-height:420px}.mapwrap{padding:8px}}</style></head><body><div class="app"><aside class="panel"><h1>地點座標整理工具 v1.2</h1><p>選擇地點後，在地圖上點選公開道路或路口中心。資料只存於目前瀏覽器。</p><label for="placeSelect">待處理地點</label><select id="placeSelect"></select><div class="coords"><div><label>緯度</label><input id="latInput" readonly></div><div><label>經度</label><input id="lngInput" readonly></div></div><button id="saveBtn" type="button">儲存此地點座標</button><button id="exportBtn" class="secondary" type="button">匯出 location_lookup.csv</button><button id="clearBtn" class="secondary" type="button">清除本機紀錄</button><div id="statusEl" class="status">載入中</div><div id="placeList" class="list"></div></aside><main class="mapwrap"><div id="map"></div></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const places=[{"city": "高雄市", "district": "橋頭區", "place": "SAMPLE｜橋頭區示範路口 A"}, {"city": "高雄市", "district": "橋頭區", "place": "SAMPLE｜Lists 表單測試路口"}, {"city": "高雄市", "district": "三民區", "place": "測試用2"}, {"city": "高雄市", "district": "楠梓區", "place": "SAMPLE｜橋頭區示範路口 A"}, {"city": "高雄市", "district": "橋頭區", "place": "SAMPLE｜資料不足"}, {"city": "高雄市", "district": "三民區", "place": "SAMPLE｜自動編號驗證"}];
const placeSelect=document.getElementById('placeSelect');
const latInput=document.getElementById('latInput');
const lngInput=document.getElementById('lngInput');
const saveBtn=document.getElementById('saveBtn');
const exportBtn=document.getElementById('exportBtn');
const clearBtn=document.getElementById('clearBtn');
const statusEl=document.getElementById('statusEl');
const placeList=document.getElementById('placeList');
const storageKey='coordinateLookupV12';
let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){saved={}}
let marker=null,selected=null;
const map=L.map('map').setView([22.72,120.31],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
const key=p=>[p.city,p.district,p.place].join('|');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function current(){return places[Number(placeSelect.value)]}
function setMarker(lat,lng){if(marker)map.removeLayer(marker);marker=L.marker([lat,lng]).addTo(map);selected={lat:Number(lat.toFixed(6)),lng:Number(lng.toFixed(6))};latInput.value=selected.lat;lngInput.value=selected.lng}
function loadCurrent(){const p=current();if(!p){statusEl.textContent='沒有可用地點';return}const v=saved[key(p)];selected=null;latInput.value='';lngInput.value='';if(marker){map.removeLayer(marker);marker=null}if(v){setMarker(v.lat,v.lng);map.setView([v.lat,v.lng],15);statusEl.textContent='已載入先前儲存座標'}else{statusEl.textContent='請在地圖上點選公開道路或路口中心'}}
function renderList(){placeList.innerHTML=places.map(p=>{const v=saved[key(p)];return '<div class="row '+(v?'done':'')+'"><b>'+esc(p.district)+'｜'+esc(p.place)+'</b>'+(v?esc(v.lat+', '+v.lng):'待處理')+'</div>'}).join('')}
function init(){placeSelect.innerHTML=places.map((p,i)=>'<option value="'+i+'">'+esc(p.district)+'｜'+esc(p.place)+'</option>').join('');renderList();loadCurrent();statusEl.textContent=places.length?'共載入 '+places.length+' 個地點，請選擇後點擊地圖':'沒有可用地點'}
map.on('click',e=>{setMarker(e.latlng.lat,e.latlng.lng);statusEl.textContent='已選取座標，請按儲存'});
placeSelect.addEventListener('change',loadCurrent);
saveBtn.addEventListener('click',()=>{const p=current();if(!p||!selected){statusEl.textContent='請先選擇地點並點擊地圖';return}saved[key(p)]={city:p.city,district:p.district,place:p.place,lat:selected.lat,lng:selected.lng};localStorage.setItem(storageKey,JSON.stringify(saved));renderList();statusEl.textContent='已儲存此地點座標'});
exportBtn.addEventListener('click',()=>{const lines=[['City','District','LocationText','Latitude','Longitude','Note']];places.forEach(p=>{const v=saved[key(p)];if(v)lines.push([p.city,p.district,p.place,v.lat,v.lng,'公開道路／路口中心，人工選點'])});const quote=v=>'"'+String(v).replace(/"/g,'""')+'"';const csv='﻿'+lines.map(r=>r.map(quote).join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='location_lookup.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
clearBtn.addEventListener('click',()=>{if(confirm('確定清除所有本機座標紀錄？')){saved={};localStorage.removeItem(storageKey);renderList();loadCurrent()}});
window.addEventListener('resize',()=>setTimeout(()=>map.invalidateSize(),100));
init();
</script></body></html>
