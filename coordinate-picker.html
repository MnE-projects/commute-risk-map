<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>地點座標整理工具</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
:root{--bg:#07111f;--p:#10243a;--l:#29445e;--t:#f8fafc;--m:#a6b6c8;--o:#ff6b22}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--t);font-family:"Microsoft JhengHei",sans-serif}.app{display:grid;grid-template-columns:360px minmax(0,1fr);min-height:100vh}.panel{padding:18px;border-right:1px solid var(--l);overflow:auto}.mapwrap{padding:12px}h1{font-size:21px;margin:0 0 8px}p{color:var(--m);font-size:13px;line-height:1.6}label{display:block;margin:13px 0 6px;font-weight:700;font-size:13px}select,input,button{width:100%;padding:10px;border-radius:9px;border:1px solid var(--l);background:#091827;color:#fff;font:inherit}button{cursor:pointer;font-weight:800;background:var(--o);border:0;margin-top:10px}.secondary{background:#173149;border:1px solid var(--l)}.coords{display:grid;grid-template-columns:1fr 1fr;gap:8px}.status{margin-top:12px;padding:10px;border-radius:9px;background:#13283e;color:#fcd34d;font-size:12px}.list{display:grid;gap:7px;margin-top:12px}.row{padding:9px;border:1px solid var(--l);border-radius:9px;font-size:12px}.done{border-color:#2dd4bf}.row b{display:block;margin-bottom:3px}#map{height:calc(100vh - 24px);border-radius:12px}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#10243a;color:#fff}@media(max-width:800px){.app{display:block}.panel{border-right:0;border-bottom:1px solid var(--l)}#map{height:60vh;min-height:420px}.mapwrap{padding:8px}}
</style></head><body><div class="app"><aside class="panel"><h1>地點座標整理工具</h1><p>選擇一筆地點，在地圖上點選公開道路或路口中心。完成後匯出 <code>location_lookup.csv</code>。不使用 GPS，也不要選擇員工住址。</p><label for="location">待處理地點</label><select id="location"></select><div class="coords"><div><label>緯度</label><input id="lat" readonly></div><div><label>經度</label><input id="lng" readonly></div></div><button id="save" type="button">儲存此地點座標</button><button id="export" class="secondary" type="button">匯出 location_lookup.csv</button><button id="clear" class="secondary" type="button">清除本機紀錄</button><div class="status" id="status">尚未選取座標</div><div class="list" id="list"></div></aside><main class="mapwrap"><div id="map"></div></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
const places=[{"city": "高雄市", "district": "橋頭區", "place": "SAMPLE｜橋頭區示範路口 A"}, {"city": "高雄市", "district": "橋頭區", "place": "SAMPLE｜Lists 表單測試路口"}, {"city": "高雄市", "district": "三民區", "place": "測試用2"}, {"city": "高雄市", "district": "楠梓區", "place": "SAMPLE｜橋頭區示範路口 A"}, {"city": "高雄市", "district": "橋頭區", "place": "SAMPLE｜資料不足"}, {"city": "高雄市", "district": "三民區", "place": "SAMPLE｜自動編號驗證"}];const key=p=>[p.city,p.district,p.place].join('|');let saved=JSON.parse(localStorage.getItem('coordinateLookupV1')||'{}'),marker=null,selected=null;const map=L.map('map').setView([22.72,120.31],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function fill(){location.innerHTML=places.map((p,i)=>`<option value="${i}">${esc(p.district)}｜${esc(p.place)}</option>`).join('');renderList();loadSelection()}function loadSelection(){const p=places[+location.value],v=saved[key(p)];selected=v||null;lat.value=v?.lat??'';lng.value=v?.lng??'';if(v){setMarker(v.lat,v.lng);map.setView([v.lat,v.lng],15);status.textContent='已載入先前儲存座標'}else{if(marker){map.removeLayer(marker);marker=null}status.textContent='請在地圖上點選公開道路或路口中心'}}function setMarker(a,b){if(marker)map.removeLayer(marker);marker=L.marker([a,b]).addTo(map);selected={lat:+a.toFixed(6),lng:+b.toFixed(6)};lat.value=selected.lat;lng.value=selected.lng}map.on('click',e=>{setMarker(e.latlng.lat,e.latlng.lng);status.textContent='已選取，請按「儲存此地點座標」'});location.onchange=loadSelection;save.onclick=()=>{if(!selected){status.textContent='請先點選地圖位置';return}const p=places[+location.value];saved[key(p)]={...selected,city:p.city,district:p.district,place:p.place};localStorage.setItem('coordinateLookupV1',JSON.stringify(saved));status.textContent='已儲存';renderList()};function renderList(){list.innerHTML=places.map(p=>`<div class="row ${saved[key(p)]?'done':''}"><b>${esc(p.district)}｜${esc(p.place)}</b>${saved[key(p)]?`${saved[key(p)].lat}, ${saved[key(p)].lng}`:'待處理'}</div>`).join('')}export.onclick=()=>{const lines=[['City','District','LocationText','Latitude','Longitude','Note'],...places.filter(p=>saved[key(p)]).map(p=>[p.city,p.district,p.place,saved[key(p)].lat,saved[key(p)].lng,'公開道路／路口中心，人工選點'])];const csv='﻿'+lines.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('
');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='location_lookup.csv';a.click();URL.revokeObjectURL(a.href)};clear.onclick=()=>{if(confirm('確定清除所有本機座標紀錄？')){saved={};localStorage.removeItem('coordinateLookupV1');fill()}};fill();window.onresize=()=>setTimeout(()=>map.invalidateSize(),100);
</script></body></html>
