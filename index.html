<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>通勤風險共創地圖</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--b:#07111f;--p:#10243a;--l:#29445e;--t:#f8fafc;--m:#a6b6c8}*{box-sizing:border-box}html,body{margin:0;max-width:100%;overflow-x:hidden;background:var(--b);color:var(--t);font-family:"Microsoft JhengHei",sans-serif}.app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}.side,.main{padding:18px}.side{border-right:1px solid var(--l)}select,input{width:100%;padding:10px;background:#091827;color:#fff;border:1px solid var(--l);border-radius:9px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px}.card{background:var(--p);border:1px solid var(--l);border-radius:15px;padding:11px}.tools{display:grid;grid-template-columns:1fr 180px;gap:8px;margin-bottom:9px}#map{height:650px;border-radius:10px}.list{display:grid;gap:8px;max-height:650px;overflow:auto}.item{padding:10px;border:1px solid var(--l);border-radius:10px;cursor:pointer}.item h3{margin:0 0 5px;font-size:14px}.item p{margin:0;color:var(--m);font-size:12px}.pill{display:inline-block;margin:6px 3px 0 0;padding:4px 7px;background:#1d3850;border-radius:999px;font-size:10px}.tag{color:#fed7aa}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#10243a;color:#fff}@media(max-width:900px){.app{display:block}.side{border-right:0;border-bottom:1px solid var(--l);padding:11px}.main{padding:10px}.grid{display:block}.card{margin-bottom:10px}.tools{grid-template-columns:1fr}#map{height:58vh;min-height:380px}.list{max-height:none}}</style></head><body><div class="app"><aside class="side"><h3>通勤風險共創地圖</h3><label>風險篩選</label><select id="risk"><option value="全部">全部回報</option></select></aside><main class="main"><h1>高雄通勤風險地圖</h1><p class="tag">SAMPLE · 社群回報 · 未經驗證</p><div class="grid"><section class="card"><div class="tools"><input id="q" placeholder="搜尋地點或風險"><select id="district"><option value="全部">全部行政區</option></select></div><div id="map"></div></section><aside class="card"><b id="count"></b><div id="list" class="list"></div></aside></div></main></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>(async()=>{const map=L.map('map').setView([22.72,120.31],11);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);const ly=L.layerGroup().addTo(map),idx={};const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let g;try{g=await(await fetch('data/commute_reports.geojson',{cache:'no-store'})).json()}catch(e){list.innerHTML='無法載入 GeoJSON';return}const fs=g.features||[];[...new Set(fs.map(f=>f.properties.risk))].sort().forEach(x=>risk.insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));[...new Set(fs.map(f=>f.properties.district))].sort().forEach(x=>district.insertAdjacentHTML('beforeend',`<option>${esc(x)}</option>`));function render(){ly.clearLayers();Object.keys(idx).forEach(k=>delete idx[k]);const rows=fs.filter(f=>{const p=f.properties;return(risk.value==='全部'||p.risk===risk.value)&&(district.value==='全部'||p.district===district.value)&&(!q.value||Object.values(p).join(' ').toLowerCase().includes(q.value.toLowerCase()))});rows.forEach(f=>{const p=f.properties,[lng,lat]=f.geometry.coordinates,m=L.circleMarker([lat,lng],{radius:10,color:'#ff6b22',fillColor:'#ff6b22',fillOpacity:.42,weight:2}).bindPopup(`<b>${esc(p.place)}</b><br>${esc(p.risk)} · ${esc(p.timePeriod)}<br><small>${esc(p.reportId)}</small>`).addTo(ly);idx[p.reportId]=m});count.textContent=`目前顯示 ${rows.length} 筆`;list.innerHTML=rows.map(f=>{const p=f.properties;return `<article class="item" data-id="${esc(p.reportId)}"><h3>${esc(p.place)}</h3><p>${esc(p.district)} · ${esc(p.risk)}</p><span class="pill">${esc(p.reportId)}</span><span class="pill">${esc(p.timePeriod)}</span></article>`}).join('');document.querySelectorAll('.item').forEach(el=>el.onclick=()=>{const f=fs.find(x=>x.properties.reportId===el.dataset.id),[lng,lat]=f.geometry.coordinates;map.flyTo([lat,lng],15);idx[el.dataset.id].openPopup()})}q.oninput=render;risk.onchange=render;district.onchange=render;render();window.onresize=()=>setTimeout(()=>map.invalidateSize(),100)})();</script></body></html>
